<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Acesso administrativo | Sara Cosméticos</title>
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
    <script src="login.js" defer></script>
  </head>

  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="loginTitle">
        <div class="brand-mark" aria-hidden="true">SC</div>
        <p class="eyebrow">Área restrita</p>
        <h1 id="loginTitle">Sara Cosméticos</h1>
        <p class="login-description">Entre para gerenciar produtos, preços e estoque.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              maxlength="160"
              required
            >
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              maxlength="200"
              required
            >
          </div>

          <button class="button button-primary button-full" id="loginButton" type="submit">
            Entrar no painel
          </button>
          <p class="form-message" id="loginMessage" role="alert" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
