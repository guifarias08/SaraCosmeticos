<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Login Admin — Sara Cosméticos</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1>Sara Cosméticos</h1>
    <p class="subtitle">Painel administrativo</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password" />

      <button type="submit">Entrar</button>
      <p id="erroMsg" class="erro" hidden></p>
    </form>
  </main>

  <script src="admin.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroMsg = document.getElementById('erroMsg');
      erroMsg.hidden = true;

      try {
        const resposta = await fetch(`${API_BASE}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha }),
        });
        const dados = await resposta.json();

        if (!resposta.ok) throw new Error(dados.erro || 'Erro ao entrar.');

        localStorage.setItem('sara_admin_token', dados.token);
        window.location.href = 'dashboard.html';
      } catch (erro) {
        erroMsg.textContent = erro.message;
        erroMsg.hidden = false;
      }
    });
  </script>
</body>
</html>
